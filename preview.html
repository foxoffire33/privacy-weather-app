  Browser-only runner for the design tool preview. It runs the real src/ files unmodified:
  Babel transpiles TS/TSX in the page and dependencies come from esm.sh.
  Not used by Vite — for development run `npm run dev`.
-->
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.2.0",
    "react/jsx-runtime": "https://esm.sh/react@19.2.0/jsx-runtime",
    "react-dom": "https://esm.sh/react-dom@19.2.0?external=react",
    "react-dom/client": "https://esm.sh/react-dom@19.2.0/client?external=react,react-dom",

<script src="https://unpkg.com/@babel/standalone@7.28.4/babel.min.js"></script>
</head>
<body>
<div id="root"><div id="boot">Loading…</div></div>
<script type="module">
const CSS_CDN = {
  '@mantine/core/styles.css': 'https://unpkg.com/@mantine/core@9.7.1/styles.css',
  '@mantine/charts/styles.css': 'https://unpkg.com/@mantine/charts@9.7.1/styles.css',
};
const modules = new Map();

function join(from, spec) {
  const parts = from.split('/'); parts.pop();
  for (const s of spec.split('/')) { if (s === '..') parts.pop(); else if (s !== '.') parts.push(s); }
  return parts.join('/');
}
async function resolveFile(base) {
  const candidates = /\.(tsx?|jsx?)$/.test(base) ? [base] : [base + '.ts', base + '.tsx', base + '/index.ts', base + '/index.tsx'];
  for (const c of candidates) {
    const r = await fetch(c);
    if (r.ok) return [c, await r.text()];
  }
  throw new Error('Cannot resolve ' + base);
}
function addCss(href) {
  const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = href; document.head.appendChild(l);
}
function load(path, text) {
  if (modules.has(path)) return modules.get(path);
  const p = (async () => {
    let code = Babel.transform(text, {
      filename: path,
      presets: [['typescript', { isTSX: path.endsWith('x'), allExtensions: true }], ['react', { runtime: 'automatic' }]],
    }).code;
    code = code.replace(/import\s*["']([^"']+\.css)["'];?/g, (_, spec) => {
      addCss(spec.startsWith('.') ? join(path, spec) : CSS_CDN[spec] || 'https://unpkg.com/' + spec);
      return '';
    });
    const specs = [...new Set([...code.matchAll(/(?:from|import)\s*["'](\.{1,2}\/[^"']+)["']/g)].map((m) => m[1]))];
    for (const spec of specs) {
      const [file, src] = await resolveFile(join(path, spec));
      const url = await load(file, src);
      code = code.split(`"${spec}"`).join(`"${url}"`).split(`'${spec}'`).join(`'${url}'`);
    }
    return URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
  })();
  modules.set(path, p);
  return p;
}
try {
  const [file, src] = await resolveFile('src/main.tsx');
  await import(await load(file, src));
} catch (e) {
  document.getElementById('root').innerHTML = '<pre style="padding:24px;white-space:pre-wrap;color:#ff9783">' + (e.stack || e) + '</pre>';
  console.error(e);
}
</script>
</body>
